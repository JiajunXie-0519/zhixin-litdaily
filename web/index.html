<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4efe5">
<title>知新 · 文献日报</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

<svg class="svg-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-2"/><path d="M6 14h12v7H6z"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.09A1.7 1.7 0 0 0 8.94 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3v-4h.09A1.7 1.7 0 0 0 4.6 8.94a1.7 1.7 0 0 0-.34-1.88L4.2 7l2.83-2.83.06.06A1.7 1.7 0 0 0 8.97 4.6 1.7 1.7 0 0 0 10 3.04V3h4v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06L19.8 7l-.06.06a1.7 1.7 0 0 0-.34 1.88A1.7 1.7 0 0 0 20.96 10H21v4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.6-4L3 10M3 4v6h6M4 13a8 8 0 0 0 14.6 4L21 14m0 6v-6h-6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="1"/><path d="M16 8V4H4v12h4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2Z"/><path d="M4 17h15M8 7h7"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 5-5m-5 5-5-5M4 19h16"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="1"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2c.6 5.4 4.6 9.4 10 10-5.4.6-9.4 4.6-10 10-.6-5.4-4.6-9.4-10-10 5.4-.6 9.4-4.6 10-10Z"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M16 7l2 2M14 9l2 2"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></symbol>
</svg>

<div id="toast-region" class="toast-region" aria-live="polite"></div>

<div id="boot-screen" class="boot-screen">
  <div class="boot-inner">
    <div class="brand-lockup">
      <div class="brand-seal">知</div>
      <div class="brand-name">知新<span>ZHIXIN</span></div>
    </div>
    <div class="boot-line"><span></span></div>
    <p>正在翻阅你的文献日报…</p>
  </div>
</div>

<div id="onboarding" class="onboarding" hidden></div>

<div id="app-shell" class="app-shell" hidden>
  <header class="masthead">
    <a class="brand-lockup brand-link" href="#today" aria-label="知新首页">
      <div class="brand-seal">知</div>
      <div class="brand-name">知新<span>ZHIXIN</span></div>
    </a>
    <nav class="main-nav" aria-label="主导航">
      <button class="nav-btn" data-route="today">今日选读</button>
      <button class="nav-btn" data-route="archive">往期</button>
      <button class="nav-btn" data-route="insights">洞察</button>
    </nav>
    <div class="masthead-tools">
      <div class="header-date" id="header-date"></div>
      <button class="icon-btn" id="btn-print" title="打开可打印日报" aria-label="打印日报"><svg><use href="#i-print"></use></svg></button>
      <button class="icon-btn" id="btn-settings" title="设置" aria-label="设置"><svg><use href="#i-settings"></use></svg></button>
      <button class="icon-btn" id="btn-quit" title="退出知新" aria-label="退出知新"><svg><use href="#i-power"></use></svg></button>
    </div>
  </header>
  <div class="masthead-rule"><span></span></div>
  <main id="view" class="view" tabindex="-1"></main>
  <footer class="site-footer">
    <div class="footer-brand">知新 · 每天几篇，读有所得</div>
    <div class="footer-note">推荐由公开学术数据源生成，评分与札记只保存在本机。</div>
    <div class="footer-links"><button data-route="archive">阅读档案</button><button id="footer-settings">设置与导出</button></div>
  </footer>
</div>

<div id="settings-drawer" class="drawer" hidden></div>

<div id="loading-overlay" class="loading-overlay" hidden>
  <div class="loading-card">
    <div class="loading-orbit"><span></span><span></span><span></span><div class="loading-core">知</div></div>
    <div class="eyebrow">TODAY'S SELECTION</div>
    <h2 id="loading-title">正在翻阅今天的期刊</h2>
    <p id="loading-status">连接学术数据源…</p>
    <div class="loading-track"><span></span></div>
    <div class="loading-sources" id="loading-sources"></div>
    <p class="loading-hint">首次检索约需 10–20 秒；结果会保存在本地，当天不再重复抓取。</p>
  </div>
</div>

<div id="confirm-dialog" class="modal" hidden>
  <div class="modal-card confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="eyebrow">PLEASE CONFIRM</div>
    <h2 id="confirm-title">确认操作</h2>
    <p id="confirm-text"></p>
    <div class="confirm-actions">
      <button class="btn btn-ghost" id="confirm-cancel">取消</button>
      <button class="btn btn-ink" id="confirm-ok">确认</button>
    </div>
  </div>
</div>

<script src="/assets/app.js"></script>
</body>
</html>
