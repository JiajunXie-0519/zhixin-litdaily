name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m py_compile app.py daily.py sources.py recommend.py report.py obsidian.py zotero.py
      - name: JavaScript syntax
        run: node --check web/app.js
